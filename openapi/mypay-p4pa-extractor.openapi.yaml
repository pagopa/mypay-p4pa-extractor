openapi: 3.1.0
info:
  title: MyPay P4PA Extractor API
  description: API for asynchronous data extraction from MyPay4 toward Piattaforma Unitaria.
  version: "1.0.0"
tags:
  - name: Extract
    description: Extraction lifecycle APIs
paths:
  /extract:
    post:
      tags:
        - Extract
      operationId: createExtraction
      summary: Start an asynchronous extraction
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionRequest'
            examples:
              organizationsExtraction:
                summary: Extract organizations
                value:
                  ipaCodes: ["00493410240", "01234567890"]
                  fileTypes: ORGANIZATIONS
                  filters:
                    dateFrom: "2024-01-01"
                    dateTo: "2026-06-18"
      responses:
        '202':
          description: Extraction accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionAcceptedResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /extract/{extractionId}:
    get:
      tags:
        - Extract
      operationId: getExtractionStatus
      summary: Get extraction status
      security:
        - basicAuth: [ ]
      parameters:
        - name: extractionId
          in: path
          required: true
          schema:
            type: string
            minLength: 36
            maxLength: 36
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      responses:
        '200':
          description: Current extraction status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionStatusResponse'
        '404':
          description: Extraction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    ExtractionRequest:
      type: object
      example:
        ipaCodes: ["00493410240", "01234567890"]
        fileTypes: ORGANIZATIONS
        lastExtractionDate: "2026-06-18T12:00:00Z"
        filters:
          dateFrom: "2024-01-01"
          dateTo: "2026-06-18"
      required:
        - ipaCodes
        - fileTypes
      properties:
        ipaCodes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
          example: ["00493410240", "01234567890"]
        fileTypes:
          $ref: '#/components/schemas/MigrationFileType'
        lastExtractionDate:
          type: string
          format: date-time
          example: "2026-06-18T12:00:00Z"
        filters:
          $ref: '#/components/schemas/ExtractionFilters'
          example:
            ipaCode: "00493410240"
            dateFrom: "2024-01-01"
            dateTo: "2026-06-18"
    ExtractionFilters:
      type: object
      properties:
        dateFrom:
          type: string
          format: date
          example: "2024-01-01"
        dateTo:
          type: string
          format: date
          example: "2026-06-18"
        logicalKey:
          type: string
          description: |-
            Optional filter whose format depends on `fileTypes`.

            - `ORGANIZATIONS`, `ORG_SIL_SERVICES`: not used.
            - `DEBT_POSITIONS_TYPE`, `DEBT_POSITIONS_TYPE_ORG`: comma-separated list of `debtPositionTypeOrgCode` values (example: `TARI,TASI`).
            - `DEBT_POSITIONS_TYPE_ORG_OPERATORS`: two comma-separated lists separated by `|` in the form `operatorFiscalCodes|debtPositionTypeOrgCodes`.
            - `DEBT_POSITIONS`: two comma-separated lists separated by `|` in the form `gpdIupds|iuds`.
          examples:
            - value
            - value1,value2,value3
            - value1,value2|value3,value4
    ExtractionAcceptedResponse:
      type: object
      required:
        - extractionId
      properties:
        extractionId:
          type: string
    ExtractionStatusResponse:
      type: object
      required:
        - extractionId
        - status
        - createdAt
        - updatedAt
        - files
      properties:
        extractionId:
          type: string
        ipaCodes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
        fileTypes:
          $ref: '#/components/schemas/MigrationFileType'
        status:
          $ref: '#/components/schemas/ExtractionStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        error:
          type: string
        files:
          type: array
          items:
            type: string
    ExtractionStatus:
      type: string
      enum:
        - RUNNING
        - COMPLETED
        - FAILED
    MigrationFileType:
      type: string
      enum:
        - ORGANIZATIONS
        - ORG_SIL_SERVICES
        - DEBT_POSITIONS_TYPE
        - DEBT_POSITIONS_TYPE_ORG
        - DEBT_POSITIONS_TYPE_ORG_OPERATORS
        - DEBT_POSITIONS
        - DEBT_POSITIONS_PAID
        - PAYMENT_NOTIFICATION
        - PAYMENTS_REPORTING
        - TREASURY_CSV_COMPLETE
        - ASSESSMENTS
        - ASSESSMENTS_REGISTRY
    ErrorDTO:
      type: object
      required:
        - category
        - code
        - message
      properties:
        category:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
            - TOO_MANY_REQUESTS
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
