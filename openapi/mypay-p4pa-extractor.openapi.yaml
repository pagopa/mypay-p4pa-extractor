openapi: 3.1.0
info:
  title: MyPay P4PA Extractor API
  description: API for asynchronous data extraction from MyPay4 toward Piattaforma Unitaria.
  version: "1.0.0"
tags:
  - name: Extract
    description: Extraction lifecycle APIs
paths:
  /extract:
    post:
      tags:
        - Extract
      operationId: createExtraction
      summary: Start an asynchronous extraction
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionRequest'
            examples:
              organizationsExtraction:
                summary: Extract organizations
                value:
                  ipaCodes: ["00493410240", "01234567890"]
                  fileTypes: ORGANIZATIONS
                  filters:
                    dateFrom: "2024-01-01"
                    dateTo: "2026-06-18"
      responses:
        '202':
          description: Extraction accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionAcceptedResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /extract/{extractionId}:
    get:
      tags:
        - Extract
      operationId: getExtractionStatus
      summary: Get extraction status
      security:
        - basicAuth: [ ]
      parameters:
        - name: extractionId
          in: path
          required: true
          schema:
            type: string
            minLength: 36
            maxLength: 36
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      responses:
        '200':
          description: Current extraction status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionStatusResponse'
        '404':
          description: Extraction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /config/sql:
    get:
      tags:
        - Config
      operationId: getSqlLocations
      summary: Get SQL locations
      security:
        - basicAuth: [ ]
      responses:
        '200':
          description: Sql loaded locations
          content:
            plain/text:
              schema:
                type: array
                items:
                  type: string
        '404':
          description: Extraction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /config/sql/{location}:
    get:
      tags:
        - Config
      operationId: getSqlContent
      summary: Get SQL location content
      security:
        - basicAuth: [ ]
      parameters:
        - name: location
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sql loaded location content
          content:
            plain/text:
              schema:
                type: string
        '404':
          description: Extraction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    ExtractionRequest:
      type: object
      example:
        ipaCodes: ["00493410240", "01234567890"]
        fileTypes: ORGANIZATIONS
        lastExtractionDate: "2026-06-18T12:00:00Z"
        filters:
          dateFrom: "2024-01-01"
          dateTo: "2026-06-18"
      required:
        - ipaCodes
        - fileTypes
      properties:
        ipaCodes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
          example: ["00493410240", "01234567890"]
        fileTypes:
          $ref: '#/components/schemas/MigrationFileType'
        lastExtractionDate:
          type: string
          format: date-time
          example: "2026-06-18T12:00:00Z"
        filters:
          $ref: '#/components/schemas/ExtractionFilters'
    ExtractionFilters:
      type: object
      properties:
        dateFrom:
          type: string
          format: date-time
          example: "2026-06-18T12:00:00Z"
        dateTo:
          type: string
          format: date-time
          example: "2026-06-18T12:00:00Z"
        logicalKey:
          type: string
          description: |-
            Optional filter whose format depends on `fileTypes`.

            - `ORGANIZATIONS`: not used.
            - `ORG_SIL_SERVICES`: not used.
            - `DEBT_POSITIONS_TYPE`: comma-separated `debtPositionTypeCode` values (example: `TARI,TASI`).
            - `DEBT_POSITIONS_TYPE_ORG`: comma-separated `debtPositionTypeOrgCode` values (example: `TARI,TASI`).
            - `DEBT_POSITIONS`: comma-separated `iuv` values (example: `0101234567890001,0101234567890002`).
            - `DEBT_POSITIONS_PAID`: comma-separated `iuv` values.
            - `DEBT_POSITIONS_TYPE_ORG_OPERATORS`: two comma-separated lists separated by `|`, in the form `operatorFiscalCodes|debtPositionTypeOrgCodes`; values at the same position form a pair.
            - `PAYMENT_NOTIFICATION`: comma-separated IUD filter values (example: `IUD-1,IUD-2`).
            - `PAYMENTS_REPORTING`: comma-separated flow identifier values (example: `FLOW-1,FLOW-2`).
            - `TREASURY_CSV_COMPLETE`: two comma-separated bill-filter lists separated by `|`, in the form `billYears|billCodes` (example: `2024,2025|BOL001,BOL002`); values at the same position form a bill pair.
            - `ASSESSMENTS`: comma-separated `assessmentName` values.
            - `ASSESSMENTS_REGISTRY`: comma-separated `debtPositionTypeOrgCode` values.
          examples:
            - "TAX"
            - "TAX,TARI,TASI"
            - "2024,2025|BOL001,BOL002"
    ExtractionAcceptedResponse:
      type: object
      required:
        - extractionId
      properties:
        extractionId:
          type: string
    ExtractionStatusResponse:
      type: object
      required:
        - extractionId
        - status
        - createdAt
        - updatedAt
        - files
      properties:
        extractionId:
          type: string
        ipaCodes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
        fileTypes:
          $ref: '#/components/schemas/MigrationFileType'
        status:
          $ref: '#/components/schemas/ExtractionStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        error:
          type: string
        files:
          type: array
          items:
            type: string
    ExtractionStatus:
      type: string
      enum:
        - RUNNING
        - COMPLETED
        - FAILED
    MigrationFileType:
      type: string
      enum:
        - ORGANIZATIONS
        - ORG_SIL_SERVICES
        - DEBT_POSITIONS_TYPE
        - DEBT_POSITIONS_TYPE_ORG
        - DEBT_POSITIONS_TYPE_ORG_OPERATORS
        - DEBT_POSITIONS
        - DEBT_POSITIONS_PAID
        - PAYMENT_NOTIFICATION
        - PAYMENTS_REPORTING
        - TREASURY_CSV_COMPLETE
        - ASSESSMENTS
        - ASSESSMENTS_REGISTRY
    ErrorDTO:
      type: object
      required:
        - category
        - code
        - message
      properties:
        category:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
            - TOO_MANY_REQUESTS
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
